name: twake_workplace_protocol
description: "Twake Workplace file picker SDK for Flutter: models, Cozy bridge, data layer, interactors and picker modal."
version: 0.2.0
publish_to: none

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  dartz: ^0.10.1
  dio: ^5.2.0
  equatable: ^2.0.5
  flutter_inappwebview: ^6.1.0
  flutter_svg: ^2.0.9
  intl: ^0.20.2
  json_annotation: ^4.9.0
  meta: ^1.11.0
  pointer_interceptor: ^0.10.1
  universal_html: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.13
  json_serializable: ^6.9.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
